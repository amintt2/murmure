name: Builds multi-plateformes

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  LLAMA_TAG: b10782
  WHISPER_TAG: b4938

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: nsis
            llama_asset: llama-${LLAMA_TAG}-bin-win-vulkan-x64.zip
          - name: macos-arm64
            os: macos-latest
            bundles: app,dmg
            llama_asset: llama-${LLAMA_TAG}-bin-macos-arm64.tar.gz
            metal: "ON"
          - name: macos-x64
            os: macos-15-intel
            bundles: app,dmg
            llama_asset: llama-${LLAMA_TAG}-bin-macos-x64.tar.gz
            metal: "OFF"
          - name: linux-x64
            os: ubuntu-22.04
            bundles: appimage,deb
            llama_asset: llama-${LLAMA_TAG}-bin-ubuntu-vulkan-x64.tar.gz
            metal: "OFF"
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Signature Apple : Developer ID + notarisation si les secrets existent, sinon ad hoc.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev libssl-dev build-essential cmake curl file libfuse2

      # ---------------------------------------------------------------- runtimes
      - name: Runtimes (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force src-tauri/runtimes/llama-cpp, src-tauri/runtimes/whisper-cpp, tmp | Out-Null
          # llama.cpp Vulkan : AMD, NVIDIA, Intel, tout GPU avec pilote Vulkan (repli CPU sinon)
          Invoke-WebRequest "https://github.com/ggml-org/llama.cpp/releases/download/$env:LLAMA_TAG/llama-$env:LLAMA_TAG-bin-win-vulkan-x64.zip" -OutFile tmp/llama.zip
          Expand-Archive tmp/llama.zip tmp/llama -Force
          $exe = Get-ChildItem tmp/llama -Recurse -Filter llama-server.exe | Select-Object -First 1
          Copy-Item "$($exe.DirectoryName)\*" src-tauri/runtimes/llama-cpp -Recurse -Force
          # whisper.cpp CPU x64
          Invoke-WebRequest "https://github.com/ggml-org/whisper.cpp/releases/download/$env:WHISPER_TAG/whisper-bin-x64.zip" -OutFile tmp/whisper.zip
          Expand-Archive tmp/whisper.zip tmp/whisper -Force
          $wexe = Get-ChildItem tmp/whisper -Recurse -Filter whisper-server.exe | Select-Object -First 1
          Copy-Item "$($wexe.DirectoryName)\*" src-tauri/runtimes/whisper-cpp -Recurse -Force

      - name: Runtime llama.cpp (Unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          mkdir -p src-tauri/runtimes/llama-cpp tmp
          asset="${{ matrix.llama_asset }}"; asset="${asset//\$\{LLAMA_TAG\}/$LLAMA_TAG}"
          curl -sL -o tmp/llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_TAG/$asset"
          tar xzf tmp/llama.tgz -C tmp
          src=$(dirname "$(find tmp -name llama-server -type f | head -1)")
          cp -R "$src"/. src-tauri/runtimes/llama-cpp/
          chmod +x src-tauri/runtimes/llama-cpp/llama-server
          src-tauri/runtimes/llama-cpp/llama-server --version || true

      - name: Runtime whisper.cpp (compilé, statique)
        if: runner.os != 'Windows'
        run: |
          set -e
          git clone --depth 1 --branch "$WHISPER_TAG" https://github.com/ggml-org/whisper.cpp tmp/whisper.cpp
          cmake -S tmp/whisper.cpp -B tmp/whisper-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=${{ matrix.metal }} -DGGML_METAL_EMBED_LIBRARY=${{ matrix.metal }} \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_SERVER=ON
          cmake --build tmp/whisper-build --config Release -j 4 --target whisper-server
          mkdir -p src-tauri/runtimes/whisper-cpp
          cp "$(find tmp/whisper-build -name whisper-server -type f | head -1)" src-tauri/runtimes/whisper-cpp/

      # ---------------------------------------------------------------- app
      - name: Install JS deps
        run: npm install

      - name: Build
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Collecte (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1).FullName dist/Murmure-windows-x64-setup.exe
          $sig = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.sig | Select-Object -First 1
          if ($sig) { Copy-Item $sig.FullName dist/Murmure-windows-x64-setup.exe.sig }

      - name: Collecte (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/dmg/*.dmg "dist/Murmure-${{ matrix.name }}.dmg"
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz "dist/Murmure-${{ matrix.name }}.app.tar.gz" || true
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig "dist/Murmure-${{ matrix.name }}.app.tar.gz.sig" || true

      - name: Collecte (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist/Murmure-linux-x64.AppImage
          cp src-tauri/target/release/bundle/appimage/*.AppImage.sig dist/Murmure-linux-x64.AppImage.sig || true
          cp src-tauri/target/release/bundle/deb/*.deb dist/Murmure-linux-x64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -la dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
            base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
            python3 - "$version" "$base" <<'PY'
          import json, os, sys, datetime
          version, base = sys.argv[1], sys.argv[2]
          plats = {
            "darwin-aarch64": "Murmure-macos-arm64.app.tar.gz",
            "darwin-x86_64": "Murmure-macos-x64.app.tar.gz",
            "windows-x86_64": "Murmure-windows-x64-setup.exe",
            "linux-x86_64": "Murmure-linux-x64.AppImage",
          }
          out = {"version": version, "notes": f"Murmure {version}", "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "platforms": {}}
          for key, name in plats.items():
              sig = os.path.join("dist", name + ".sig")
              if os.path.exists(sig) and os.path.exists(os.path.join("dist", name)):
                  out["platforms"][key] = {"url": f"{base}/{name}", "signature": open(sig).read().strip()}
          json.dump(out, open("dist/latest.json", "w"), indent=2)
          print(json.dumps(out, indent=2))
          PY
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Murmure $tag" --generate-notes
            gh release upload "$tag" dist/* --clobber
          else
            gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease --title "Murmure — build de test (nightly)" \
              --notes "Dernier build automatique de la branche main. Windows 10/11 x64 (GPU via Vulkan : AMD, NVIDIA, Intel ; repli CPU), macOS Apple Silicon et Intel (.dmg non notarisé : clic droit → Ouvrir au premier lancement), Linux x64 (AppImage, .deb)."
            gh release upload nightly dist/* --clobber
          fi
